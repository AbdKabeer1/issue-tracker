name: Deploy (Vercel Staging)

# Deploys Team Zendor's fork (Zedu-Endor/bug-tracker) to Vercel on every merge to main.
# This provides a live testing environment for the team to verify changes before
# submitting PRs upstream to zeduchat/bug-tracker (which deploys to Coolify).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Lint, Type Check & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      AUTH_SECRET: "ci-build-secret-dummy-must-be-long-enough-32-chars"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Vercel
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Check Vercel Secrets
        id: check-secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || \
             [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || \
             [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be configured in Settings -> Secrets and variables -> Actions. Skipping Vercel deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.configured == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
